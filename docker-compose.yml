# Disposable Postgres for local development and the `test` environment.
#
# The Kassepris schema is Postgres-specific (uuid / gen_random_uuid / pg_trgm /
# xpath), so tests can't run on SQLite or an in-memory shim - they run against
# a real, throwaway Postgres, and this is it. Exposed on 5433 so it never
# clashes with a Postgres already running locally on 5432.
#
#   docker compose up -d db
#   APP_ENV=test npm run db:init        # or db:migrate against a legacy dump
#   APP_ENV=test npm run products:update-all
#
# Point .env.test at it:
#   DB_URL=postgresql://kassepris:kassepris@localhost:5433/kassepris_test

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kassepris
      POSTGRES_PASSWORD: kassepris
      POSTGRES_DB: kassepris_test
    ports:
      - "5433:5432"
    volumes:
      - kassepris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassepris -d kassepris_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The scraper pipeline. Runs one-off commands against the db service; not a
  # long-running server. Examples:
  #   docker compose run --rm app npm run db:init            # schema + stores
  #   docker compose run --rm app npm run products:update-all # offers
  #   docker compose run --rm app npm run db:schema          # schema only
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Coop API keys (COOP_*_SUBSCRIPTION_KEY) come from the host .env at runtime,
    # not from the image. DB_URL/APP_ENV/DB_SSL below override anything in .env.
    env_file:
      - .env
    environment:
      APP_ENV: development
      DB_SSL: "false"
      DB_URL: postgresql://kassepris:kassepris@db:5432/kassepris_test

volumes:
  kassepris_pgdata:
